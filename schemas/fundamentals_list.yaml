fundamentals_list:
  - id: "horizontal_push"
    description: "Drive weight away from your torso in a chest-level path to build pressing strength and shoulder stability; think full-body bracing while the chest, anterior delts, and triceps do the work."
    examples:
      - "Push-Up"
      - "Bench Press"
      - "Floor Press"
      - "Svend Press"

  - id: "horizontal_pull"
    description: "Row weight toward you to strengthen the upper back and improve posture, balancing hours of forward-rounded sitting. Grip and elbow angle shift the emphasis between lats, rhomboids, and traps."
    examples:
      - "Bent-Over Row"
      - "Pendlay Row"
      - "Single-Arm Row"
      - "Inverted Row"
      - "T-bar Row"
      - "Seated Cable Row"

  - id: "vertical_push"
    description: "Press weight overhead to train shoulder strength, mobility, and rotator-cuff control—key for safe reaching and lifting above head height."
    examples:
      - "Dumbbell Z-Press"
      - "Barbell Overhead Press"
      - "Push Press"
      - "Dumbbell Shoulder Press"

  - id: "vertical_pull"
    description: "Pull from overhead to your torso (or pull your body up) to develop lats and upper-back while challenging shoulder stability at end range."
    examples:
      - "Pull-Up"
      - "Chin-Up"
      - "Lat Pulldown"
      - "Kneeling Cable Pulldown"

  - id: "squat"
    description: "Lower and raise your body by bending at hips and knees while maintaining a stable spine—foundational for leg strength, mobility, and everyday tasks."
    examples:
      - "Goblet Squat"
      - "Front Squat"
      - "Back Squat"
      - "Overhead Squat"
      - "Lunge"
      - "Split Squat"

  - id: "hinge"
    description: "Shift the hips back with a neutral spine to load the posterior chain for powerful, spine-safe lifting and athletic force production."
    examples:
      - "Deadlift"
      - "Hip Thrust"
      - "Glute Bridge"
      - "Romanian Deadlift"
      - "Kettlebell Swing"

  - id: "rotation"
    description: "Create—or resist—twisting through the torso to link hips and shoulders, boost core integrity, and improve change-of-direction and daily tasks."
    examples:
      - "Cable Woodchopper"
      - "Kettlebell Windmill"
      - "Pallof Press"
      - "Side Plank"
      - "Bird Dog"
